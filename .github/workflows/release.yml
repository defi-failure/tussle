name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: universal macOS binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tussle-cli") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match crate version $version"
            exit 1
          fi

      - name: Build both architectures
        run: |
          cargo build --release --locked -p tussle-cli --target aarch64-apple-darwin
          cargo build --release --locked -p tussle-cli --target x86_64-apple-darwin

      - name: Merge into one universal binary
        run: |
          mkdir -p out
          lipo -create -output out/tussle \
            target/aarch64-apple-darwin/release/tussle \
            target/x86_64-apple-darwin/release/tussle
          lipo -info out/tussle
          out/tussle --version
          (cd out && shasum -a 256 tussle > tussle.sha256 && cat tussle.sha256)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes $prerelease \
            out/tussle out/tussle.sha256
