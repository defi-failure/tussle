version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Its tags are Rust versions, not action versions. The MSRV job pins
      # the compiler through the `toolchain` input instead.
      - dependency-name: dtolnay/rust-toolchain
