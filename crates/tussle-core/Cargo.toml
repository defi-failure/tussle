[package]
name = "tussle-core"
description = "Scan engine and data model for the keyboard shortcuts registered on a Mac"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bitflags = "2.11.1"
plist = "1.9.0"
thiserror = "2.0.18"
tracing = "0.1.44"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
ctrlc = "3.5.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSEnumerator"] }
