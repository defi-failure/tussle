# git-cliff configuration. Release notes and CHANGELOG.md are built from
# the commit log, not from pull requests: this project's history is
# strict Conventional Commits, and most of it lands on main directly, so
# GitHub's own PR-based notes would show almost nothing.

[changelog]
header = """
# Changelog

All notable changes to this project. Generated from the commit log with
[git-cliff](https://git-cliff.org); the format follows
[Conventional Commits](https://www.conventionalcommits.org).

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}\

### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = false
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^build|^ci", group = "<!-- 6 -->Build and CI" },
  { message = "^chore", skip = true },
  { message = "^style", skip = true },
  { body = ".*security", group = "<!-- 7 -->Security" },
]
